<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Archived">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="../app-icon.svg">
  <link rel="manifest" href="../site.webmanifest">
  <title>St. Louis Trip — Archived</title>
  <style>
    :root {
      --bg: #0f0f0f; --surface: #1a1a1a; --border: #2e2e2e;
      --text: #f0f0f0; --text2: #a0a0a0; --text3: #555; --gold: #d4a843;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh; display: grid; place-items: center;
      padding: 28px 20px; text-align: center;
    }
    main { max-width: 380px; }
    .eyebrow { color: var(--text3); font-size: 10px; font-weight: 800; letter-spacing: 2px; margin-bottom: 8px; text-transform: uppercase; }
    h1 { font-size: 26px; line-height: 1.1; margin-bottom: 10px; }
    p { color: var(--text2); font-size: 14px; line-height: 1.5; margin-bottom: 18px; }
    a { color: var(--gold); font-size: 13px; font-weight: 800; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Archived trip</div>
    <h1>St. Louis is no longer available</h1>
    <p>This itinerary has been retired, so old shared links no longer show trip details.</p>
    <a href="../menu.html">View current trip pages</a>
  </main>
</body>
</html>
