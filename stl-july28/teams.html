<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardinals vs. Cubs — July 28</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #222;
      --border: #2e2e2e;
      --text: #f0f0f0;
      --text2: #a0a0a0;
      --text3: #606060;
      --radius: 12px;
      --radius-sm: 8px;

      --stl-red: #c41e3a;
      --stl-navy: #0c2340;
      --stl-gold: #fedb00;
      --chc-blue: #0e3386;
      --chc-red: #cc3433;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── TEAM SELECTOR ── */
    #selector {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 20px 40px;
    }
    .sel-eyebrow {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text3);
      font-weight: 700;
      margin-bottom: 6px;
    }
    .sel-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 4px;
      text-align: center;
    }
    .sel-sub {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 28px;
      text-align: center;
    }
    .team-cards {
      display: flex;
      gap: 14px;
      width: 100%;
      max-width: 420px;
    }
    .team-card {
      flex: 1;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 12px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: border-color 0.18s, background 0.18s;
      -webkit-tap-highlight-color: transparent;
    }
    .team-card:active { opacity: 0.85; }
    .team-card.stl { border-color: var(--stl-red); }
    .team-card.chc { border-color: var(--chc-blue); }
    .team-logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
    }
    .team-card-name {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
    }
    .team-card.stl .team-card-name { color: var(--stl-red); }
    .team-card.chc .team-card-name { color: var(--chc-blue); }
    .team-card-tap {
      font-size: 11px;
      color: var(--text3);
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .vs-badge {
      font-size: 18px;
      font-weight: 900;
      color: var(--text3);
      align-self: center;
      flex-shrink: 0;
    }

    /* ── TEAM VIEW ── */
    #team-view { display: none; }

    .team-hero {
      padding: 20px 18px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .team-hero-logo {
      width: 56px;
      height: 56px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .team-hero-info { flex: 1; }
    .team-hero-name {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.15;
    }
    .team-hero-sub {
      font-size: 12px;
      color: var(--text2);
      margin-top: 2px;
    }
    .back-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text2);
      cursor: pointer;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .back-btn:active { opacity: 0.7; }

    /* ── SECTION ── */
    .section {
      padding: 0 16px;
      margin-top: 20px;
    }
    .section-label {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text3);
      font-weight: 700;
      margin-bottom: 10px;
      padding: 0 2px;
    }

    /* ── PITCHER CARD ── */
    .pitcher-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 6px;
    }
    .pitcher-header {
      padding: 12px 14px 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .pitcher-name { font-size: 16px; font-weight: 800; }
    .pitcher-name a { color: var(--text); text-decoration: none; }
    .pitcher-name a::after { content: ' ↗'; font-size: 11px; font-weight: 400; opacity: 0.5; }
    .pitcher-name a:active { opacity: 0.7; }
    body.stl .pitcher-name a { color: #e8637a; }
    body.chc .pitcher-name a { color: #7aabff; }
    .pitcher-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .pitcher-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .pitcher-stats {
      display: flex;
      border-top: 1px solid var(--border);
    }
    .pitcher-stat {
      flex: 1;
      padding: 10px 0 8px;
      text-align: center;
      border-right: 1px solid var(--border);
    }
    .pitcher-stat:last-child { border-right: none; }
    .pitcher-stat-val {
      font-size: 17px;
      font-weight: 800;
      line-height: 1;
    }
    .pitcher-stat-lbl {
      font-size: 10px;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 3px;
    }
    .pitcher-note {
      padding: 10px 14px 12px;
      font-size: 13px;
      color: var(--text2);
      border-top: 1px solid var(--border);
      line-height: 1.45;
    }

    /* ── PLAYER ROWS ── */
    .player-list {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .player-row {
      display: flex;
      align-items: flex-start;
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .player-row:last-child { border-bottom: none; }
    .player-num {
      font-size: 12px;
      font-weight: 800;
      min-width: 28px;
      padding-top: 1px;
      color: var(--text3);
    }
    .player-main { flex: 1; }
    .player-name { font-size: 14px; font-weight: 700; color: var(--text); text-decoration: none; }
    .player-name:active { opacity: 0.7; }
    .player-name::after { content: ' ↗'; font-size: 11px; font-weight: 400; opacity: 0.5; }
    .player-pos {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-left: 6px;
      color: var(--text3);
    }
    .player-stats-row {
      display: flex;
      gap: 12px;
      margin-top: 3px;
    }
    .pstat {
      font-size: 12px;
      color: var(--text2);
    }
    .pstat span { font-weight: 700; color: var(--text); }
    .player-note {
      font-size: 12px;
      color: var(--text2);
      margin-top: 4px;
      line-height: 1.4;
    }

    /* ── FULL ROSTER ── */
    .roster-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 16px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      color: var(--text2);
      -webkit-tap-highlight-color: transparent;
    }
    .roster-toggle:active { opacity: 0.7; }
    .roster-toggle .arrow { transition: transform 0.2s; font-size: 11px; }
    .roster-toggle.open .arrow { transform: rotate(180deg); }
    .roster-body {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 var(--radius) var(--radius);
      overflow: hidden;
    }
    .roster-body.open { display: block; }
    .roster-group-label {
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text3);
      font-weight: 700;
      padding: 10px 14px 4px;
    }
    .roster-row {
      display: flex;
      align-items: center;
      padding: 7px 14px;
      border-top: 1px solid var(--border);
      gap: 10px;
    }
    .roster-num {
      font-size: 12px;
      font-weight: 800;
      color: var(--text3);
      min-width: 28px;
    }
    .roster-name { font-size: 13px; font-weight: 600; flex: 1; }
    .roster-pos {
      font-size: 11px;
      color: var(--text3);
      font-weight: 700;
      text-transform: uppercase;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
    }

    .pb-safe { height: 40px; }

    /* ── COLOR THEMING ── */
    body.stl .team-hero { background: linear-gradient(135deg, #1a0005 0%, #0f0f0f 100%); }
    body.stl .pitcher-badge { background: rgba(196,30,58,0.15); border: 1px solid rgba(196,30,58,0.4); color: var(--stl-red); }
    body.stl .pitcher-stat-val { color: var(--stl-red); }
    body.stl .player-num { color: var(--stl-red); }
    body.stl .player-pos { color: var(--stl-red); }
    body.stl .player-name { color: #e8637a; }
    body.stl .roster-num { color: var(--stl-red); }

    body.chc .team-hero { background: linear-gradient(135deg, #000e28 0%, #0f0f0f 100%); }
    body.chc .pitcher-badge { background: rgba(14,51,134,0.2); border: 1px solid rgba(14,51,134,0.5); color: #5b8ce8; }
    body.chc .pitcher-stat-val { color: #5b8ce8; }
    body.chc .player-num { color: #5b8ce8; }
    body.chc .player-pos { color: #5b8ce8; }
    body.chc .player-name { color: #7aabff; }
    body.chc .roster-num { color: #5b8ce8; }
  </style>
</head>

    let rosterOpen = false;

    function showTeam(team) {
      const d = DATA[team];
      document.getElementById('selector').style.display = 'none';
      document.getElementById('team-view').style.display = 'block';
      document.body.className = team;

      document.getElementById('tv-logo').src = d.logo;
      document.getElementById('tv-logo').alt = d.name;
      document.getElementById('tv-name').textContent = d.name;
      document.getElementById('tv-sub').textContent = d.sub;

      const p = d.pitcher;
      document.getElementById('p-name').innerHTML = p.url ? `<a href="${p.url}" target="_blank">${p.name}</a>` : p.name;
      document.getElementById('p-sub').textContent = p.role;
      document.getElementById('p-wl').textContent = p.wl;
      document.getElementById('p-era').textContent = p.era;
      document.getElementById('p-whip').textContent = p.whip;
      document.getElementById('p-k').textContent = p.k;
      document.getElementById('p-note').textContent = p.note;

      const sl = document.getElementById('starters-list');
      sl.innerHTML = d.starters.map(s => `
        <div class="player-row">
          <div class="player-num">#${s.num}</div>
          <div class="player-main">
            <div>
              <a class="player-name" href="${s.url}" target="_blank">${s.name}</a>
              <span class="player-pos">${s.pos}</span>
            </div>
            <div class="player-stats-row">
              <div class="pstat">AVG <span>${s.avg}</span></div>
              <div class="pstat">HR <span>${s.hr}</span></div>
              <div class="pstat">RBI <span>${s.rbi}</span></div>
              <div class="pstat">OPS <span>${s.ops}</span></div>
            </div>
            <div class="player-note">${s.note}</div>
          </div>
        </div>
      `).join('');

      const rb = document.getElementById('roster-body');
      rb.innerHTML = d.roster.map(group => `
        <div class="roster-group-label">${group.group}</div>
        ${group.players.map(p => `
          <div class="roster-row">
            <div class="roster-num">#${p.num}</div>
            <div class="roster-name">${p.name}</div>
            <div class="roster-pos">${p.pos}</div>
          </div>
        `).join('')}
      `).join('');

      rosterOpen = false;
      document.getElementById('roster-toggle').classList.remove('open');
      document.getElementById('roster-body').classList.remove('open');
      window.scrollTo(0, 0);
    }

    function showSelector() {
      document.getElementById('team-view').style.display = 'none';
      document.getElementById('selector').style.display = 'flex';
      document.body.className = '';
      window.scrollTo(0, 0);
    }

    function toggleRoster() {
      rosterOpen = !rosterOpen;
      document.getElementById('roster-toggle').classList.toggle('open', rosterOpen);
      document.getElementById('roster-body').classList.toggle('open', rosterOpen);
    }
  </script>
