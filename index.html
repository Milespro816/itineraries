<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Pages</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2e2e2e;
      --text: #f0f0f0;
      --text2: #a0a0a0;
      --text3: #555;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: 36px 20px 60px;
      max-width: 480px;
      margin: 0 auto;
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--text3);
      font-weight: 700;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .sub {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 28px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 14px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.15s;
    }
    .card:active { opacity: 0.75; }

    .card-icon {
      font-size: 36px;
      line-height: 1;
    }

    .card-label {
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      line-height: 1.3;
    }

    .card-sub {
      font-size: 11px;
      color: var(--text2);
      text-align: center;
      line-height: 1.4;
    }

    .card-date {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text3);
    }

    /* per-card accent colors */
    .card.wnba { border-color: #f05023; }
    .card.wnba .card-label { color: #f05023; }
    .card.wnba .card-date { border-color: #f05023; color: #f05023; }
  </style>
</head>
<body>

  <div class="eyebrow">Milespro816 · Live</div>
  <h1>Live Pages</h1>
  <p class="sub">Real-time event pages and quick references</p>

  <div class="grid">

    <a class="card wnba" href="wnba-allstar-2026.html">
      <div class="card-icon">🏀</div>
      <div class="card-label">WNBA All-Star 2026</div>
      <div class="card-sub">Team Coop vs. Team Spoon · Rosters &amp; Players</div>
      <div class="card-date">Jul 25, 2026</div>
    </a>

  </div>

</body>
</html>
