<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trip Pages">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="app-icon.svg">
  <link rel="manifest" href="site.webmanifest">
  <title>Vic's Trip Pages</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f2a44'/%3E%3Crect x='14' y='16' width='36' height='34' rx='5' fill='white'/%3E%3Crect x='14' y='16' width='36' height='10' rx='5' fill='%23d4a843'/%3E%3Ccircle cx='24' cy='34' r='3' fill='%230f2a44'/%3E%3Ccircle cx='32' cy='34' r='3' fill='%230f2a44'/%3E%3Ccircle cx='40' cy='34' r='3' fill='%230f2a44'/%3E%3Ccircle cx='24' cy='43' r='3' fill='%230f2a44'/%3E%3Ccircle cx='32' cy='43' r='3' fill='%230f2a44'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0f0f0f; --surface: #1a1a1a; --border: #2e2e2e;
      --text: #f0f0f0; --text2: #a0a0a0; --text3: #555; --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh; padding: 36px 20px 60px;
      max-width: 480px; margin: 0 auto;
    }
    .eyebrow { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text3); font-weight: 700; margin-bottom: 6px; }
    h1 { font-size: 26px; font-weight: 800; margin-bottom: 4px; }
    .sub { font-size: 13px; color: var(--text2); margin-bottom: 28px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px 14px 18px;
      display: flex; flex-direction: column; align-items: center;
      gap: 10px; text-decoration: none; color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    .card:active { opacity: 0.75; }
    .card-icon { font-size: 36px; line-height: 1; }
    .card-label { font-size: 13px; font-weight: 800; text-align: center; line-height: 1.3; }
    .card-sub { font-size: 11px; color: var(--text2); text-align: center; line-height: 1.4; }
    .card-date { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; padding: 3px 10px; border-radius: 20px; background: var(--bg); border: 1px solid var(--border); color: var(--text3); }
    .card.stl { border-color: #c41e3a; }
    .card.stl .card-label { color: #e8637a; }
    .card.stl .card-date { border-color: #c41e3a; color: #e8637a; }
    .card.mke { border-color: #4a9edd; }
    .card.mke .card-label { color: #7ab8e8; }
    .card.mke .card-date { border-color: #4a9edd; color: #7ab8e8; }
    .card.bts { border-color: #9b7cff; }
    .card.bts .card-label { color: #b8a5ff; }
    .card.bts .card-date { border-color: #9b7cff; color: #b8a5ff; }
  </style>
</head>
<body>
  <div class="eyebrow">Vic Miles · Live</div>
  <h1>Trip Pages</h1>
  <p class="sub">Active itineraries and event guides</p>

  <div class="grid">

    <a class="card bts" href="chicago-bts-2026/index.html">
      <div class="card-icon">💜</div>
      <div class="card-label">Chicago BTS</div>
      <div class="card-sub">Kim + friends · Soldier Field · public draft</div>
      <div class="card-date">Aug 27–29, 2026</div>
    </a>

    <a class="card mke" href="milwaukee-aug6/index.html">
      <div class="card-icon">🍺</div>
      <div class="card-label">Milwaukee</div>
      <div class="card-sub">Vic &amp; Kim · David &amp; Sarah · Supper Club</div>
      <div class="card-date">Aug 6–9, 2026</div>
    </a>

  </div>
</body>
</html>
