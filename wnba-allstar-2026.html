<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 WNBA All-Star Rosters</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #222;
      --border: #2e2e2e;
      --text: #f0f0f0;
      --text2: #a0a0a0;
      --text3: #555;
      --radius: 12px;
      --coop: #d42b2b;
      --spoon: #1a56c8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      padding-bottom: 50px;
      max-width: 520px;
      margin: 0 auto;
    }

    /* ── SELECTOR ── */
    #selector {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 20px 36px;
    }

    .back-home {
      align-self: flex-start;
      font-size: 12px;
      font-weight: 700;
      color: var(--text3);
      text-decoration: none;
      margin-bottom: 20px;
      -webkit-tap-highlight-color: transparent;
    }
    .back-home:active { opacity: 0.6; }

    .sel-eyebrow {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text3);
      font-weight: 700;
      margin-bottom: 5px;
    }
    .sel-title {
      font-size: 20px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 4px;
    }
    .sel-sub {
      font-size: 12px;
      color: var(--text2);
      text-align: center;
      margin-bottom: 26px;
    }

    .team-cards {
      display: flex;
      gap: 14px;
      width: 100%;
    }
    .team-card {
      flex: 1;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 10px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .team-card:active { opacity: 0.8; }
    .team-card.coop { border-color: var(--coop); }
    .team-card.spoon { border-color: var(--spoon); }

    .team-card-icon { font-size: 40px; line-height: 1; }
    .team-card-name {
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      line-height: 1.3;
    }
    .team-card.coop .team-card-name { color: var(--coop); }
    .team-card.spoon .team-card-name { color: #4a7fe8; }
    .team-card-cap {
      font-size: 10px;
      color: var(--text2);
      text-align: center;
    }
    .team-card-tap { font-size: 11px; color: var(--text3); font-weight: 600; }

    .vs-badge {
      font-size: 16px;
      font-weight: 900;
      color: var(--text3);
      align-self: center;
      flex-shrink: 0;
    }

    /* ── TEAM VIEW ── */
    #team-view { display: none; }

    .team-hero {
      padding: 18px 18px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .team-hero-icon { font-size: 42px; flex-shrink: 0; }
    .team-hero-info { flex: 1; }
    .team-hero-name { font-size: 20px; font-weight: 800; line-height: 1.2; }
    .team-hero-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .back-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text2);
      cursor: pointer;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .back-btn:active { opacity: 0.7; }

    /* ── PLAYER TABLE ── */
    .section {
      padding: 0 16px;
      margin-top: 18px;
    }
    .section-label {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text3);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .player-list {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .player-row {
      display: flex;
      align-items: center;
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .player-row:last-child { border-bottom: none; }

    .player-num {
      font-size: 13px;
      font-weight: 800;
      min-width: 30px;
      color: var(--text3);
      flex-shrink: 0;
    }
    .player-info { flex: 1; min-width: 0; }
    .player-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-name:active { opacity: 0.7; }
    .player-meta {
      font-size: 11px;
      color: var(--text2);
      margin-top: 1px;
    }
    .player-pos {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      color: var(--text3);
      background: var(--surface2);
      flex-shrink: 0;
    }

    body.coop .player-num { color: var(--coop); }
    body.coop .player-name { color: #ff7070; }
    body.coop .team-hero-name { color: var(--coop); }

    body.spoon .player-num { color: #4a7fe8; }
    body.spoon .player-name { color: #7aabff; }
    body.spoon .team-hero-name { color: #4a7fe8; }
  </style>
</head>
<body>

  <!-- ── SELECTOR ── -->
  <div id="selector">
    <a class="back-home" href="index.html">← Live Pages</a>
    <div class="sel-eyebrow">July 25, 2026 · United Center, Chicago</div>
    <div class="sel-title">2026 AT&amp;T WNBA All-Star</div>
    <div class="sel-sub">ABC · 8:30 PM ET · Select a team</div>

    <div class="team-cards">
      <div class="team-card coop" onclick="showTeam('coop')">
        <div class="team-card-icon">🔴</div>
        <div class="team-card-name">Team Coop</div>
        <div class="team-card-cap">Captain: Cynthia Cooper</div>
        <div class="team-card-tap">↑ Tap</div>
      </div>
      <div class="vs-badge">VS</div>
      <div class="team-card spoon" onclick="showTeam('spoon')">
        <div class="team-card-icon">🔵</div>
        <div class="team-card-name">Team Spoon</div>
        <div class="team-card-cap">Captain: Teresa Weatherspoon</div>
        <div class="team-card-tap">↑ Tap</div>
      </div>
    </div>
  </div>

  <!-- ── TEAM VIEW ── -->
  <div id="team-view">
    <div class="team-hero">
      <div id="tv-icon" class="team-hero-icon"></div>
      <div class="team-hero-info">
        <div id="tv-name" class="team-hero-name"></div>
        <div id="tv-sub" class="team-hero-sub"></div>
      </div>
      <div class="back-btn" onclick="showSelector()">← Teams</div>
    </div>

    <div class="section">
      <div class="section-label">Roster</div>
      <div id="player-list" class="player-list"></div>
    </div>
  </div>

  <script>
    const TEAMS = {
      coop: {
        name: 'Team Coop',
        icon: '🔴',
        sub: 'Captain: Cynthia Cooper · Red',
        players: [
          { num:'5',  name:'Paige Bueckers',    pos:'Guard',          team:'Dallas Wings',       url:'https://www.wnba.com/player/1642784/paige-bueckers' },
          { num:'30', name:'Breanna Stewart',   pos:'Forward',        team:'New York Liberty',   url:'https://www.wnba.com/player/1627668/breanna-stewart' },
          { num:'0',  name:'Kelsey Mitchell',   pos:'Guard',          team:'Indiana Fever',      url:'https://www.wnba.com/player/1628909/kelsey-mitchell' },
          { num:'1',  name:'Natasha Howard',    pos:'Forward',        team:'Minnesota Lynx',     url:'https://www.wnba.com/player/203827/natasha-howard' },
          { num:'1',  name:'Gabby Williams',    pos:'Forward',        team:'Golden State Valkyries', url:'https://www.wnba.com/player/1628931/gabby-williams' },
          { num:'5',  name:'Angel Reese',       pos:'Forward',        team:'Atlanta Dream',      url:'https://www.wnba.com/player/1642291/angel-reese' },
          { num:'3',  name:'Marina Mabrey',     pos:'Guard',          team:'Toronto Tempo',      url:'https://www.wnba.com/player/1629497/marina-mabrey' },
          { num:'14', name:'Dominique Malonga', pos:'Center',         team:'Seattle Storm',      url:'https://www.wnba.com/player/1642798/dominique-malonga' },
          { num:'2',  name:'Kahleah Copper',    pos:'Guard/Forward',  team:'Phoenix Mercury',    url:'https://www.wnba.com/player/1627674/kahleah-copper', note:'Injury replacement for Kelsey Plum' },
          { num:'0',  name:'Jackie Young',      pos:'Guard',          team:'Las Vegas Aces',     url:'https://www.wnba.com/player/1629498/jackie-young' },
          { num:'22', name:'Sonia Citron',      pos:'Guard',          team:'Washington Mystics', url:'https://www.wnba.com/player/1642785/sonia-citron' },
        ]
      },
      spoon: {
        name: 'Team Spoon',
        icon: '🔵',
        sub: 'Captain: Teresa Weatherspoon · Blue',
        players: [
          { num:'22', name:'Caitlin Clark',      pos:'Guard',          team:'Indiana Fever',      url:'https://www.wnba.com/player/1642286/caitlin-clark' },
          { num:'22', name:'A\'ja Wilson',       pos:'Center',         team:'Las Vegas Aces',     url:'https://www.wnba.com/player/1628932/aja-wilson' },
          { num:'5',  name:'Olivia Miles',       pos:'Guard',          team:'Minnesota Lynx',     url:'https://www.wnba.com/player/1643426/olivia-miles' },
          { num:'7',  name:'Aliyah Boston',      pos:'Center/Forward', team:'Indiana Fever',      url:'https://www.wnba.com/player/1641648/aliyah-boston' },
          { num:'32', name:'Jessica Shepard',    pos:'Forward',        team:'Dallas Wings',       url:'https://www.wnba.com/player/1629491/jessica-shepard' },
          { num:'10', name:'Rhyne Howard',       pos:'Guard',          team:'Atlanta Dream',      url:'https://www.wnba.com/player/1631009/rhyne-howard' },
          { num:'15', name:'Allisha Gray',       pos:'Guard',          team:'Atlanta Dream',      url:'https://www.wnba.com/player/1628277/allisha-gray' },
          { num:'35', name:'Jonquel Jones',      pos:'Center',         team:'New York Liberty',   url:'https://www.wnba.com/player/1627673/jonquel-jones' },
          { num:'10', name:'Courtney Williams',  pos:'Guard',          team:'Minnesota Lynx',     url:'https://www.wnba.com/player/1627675/courtney-williams' },
          { num:'44', name:'Kiki Iriafen',       pos:'Forward',        team:'Washington Mystics', url:'https://www.wnba.com/player/1642792/kiki-iriafen' },
          { num:'30', name:'Nneka Ogwumike',     pos:'Forward',        team:'Los Angeles Sparks', url:'https://www.wnba.com/player/203014/nneka-ogwumike' },
        ]
      }
    };

    function showTeam(team) {
      const d = TEAMS[team];
      document.getElementById('selector').style.display = 'none';
      document.getElementById('team-view').style.display = 'block';
      document.body.className = team;

      document.getElementById('tv-icon').textContent = d.icon;
      document.getElementById('tv-name').textContent = d.name;
      document.getElementById('tv-sub').textContent = d.sub;

      document.getElementById('player-list').innerHTML = d.players.map(p => `
        <div class="player-row">
          <div class="player-num">#${p.num}</div>
          <div class="player-info">
            <a class="player-name" href="${p.url}" target="_blank">${p.name}</a>
            <div class="player-meta">${p.team}${p.note ? ' · <em>' + p.note + '</em>' : ''}</div>
          </div>
          <div class="player-pos">${p.pos}</div>
        </div>
      `).join('');

      window.scrollTo(0, 0);
    }

    function showSelector() {
      document.getElementById('team-view').style.display = 'none';
      document.getElementById('selector').style.display = 'flex';
      document.body.className = '';
      window.scrollTo(0, 0);
    }
  </script>
</body>
</html>
